name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: check
        run: make ci
      - name: build artifacts
        run: make release VERSION="${GITHUB_REF_NAME#v}"
      - name: verify artifacts
        run: |
          cd bin/release
          sha256sum -c SHA256SUMS
          ./tinyship-linux-amd64 version
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            bin/release/tinyship-linux-amd64 \
            bin/release/install.sh \
            bin/release/SHA256SUMS \
            bin/release/tinyship-linux-amd64.cdx.json \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
